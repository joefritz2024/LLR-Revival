<style>
:root {
  --ink: #3a0a18;         /* dunkles Weinrot: Schrift */
  --wine: #9b1c3a;        /* Hausfarbe der App */
  --gold: #b8891a;        /* \"Warm & Gold\" */
  --page: #f9f6ff;        /* Hintergrund der App */
  --line: #e4d6dd;
  --soft: #6b4a55;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 400 1.125rem/1.65 "Source Serif 4", Georgia, "Times New Roman", serif;
}
a { color: var(--wine); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }

/* Die vier Tueren: das eine auffaellige Element der Seite */
.doors { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 4px solid var(--wine); background: #fff; }
.doors button {
  appearance: none; border: 0; border-right: 1px solid var(--line); background: #fff; color: var(--soft);
  font: 600 1.05rem/1.2 "Source Serif 4", Georgia, serif; padding: 1.1rem 0.5rem 0.9rem; cursor: pointer;
}
.doors button:last-child { border-right: 0; }
.doors button span { display: block; font-size: 1.6rem; margin-bottom: 0.25rem; }
.doors button[aria-selected="true"] { background: var(--wine); color: #fff; }

header.hero { padding: 3rem 0 2rem; }
h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.08; margin: 0 0 0.75rem; font-weight: 700; letter-spacing: -0.01em; }
.lead { font-size: 1.25rem; margin: 0 0 1.75rem; color: var(--ink); }
.cta { display: inline-block; background: var(--wine); color: #fff; text-decoration: none; font-weight: 600; padding: 0.85rem 1.4rem; border-radius: 6px; }
.cta:hover { background: #7d1530; }
.sub { display: block; margin-top: 0.6rem; font-size: 0.95rem; color: var(--soft); }

section { padding: 1.75rem 0; border-top: 1px solid var(--line); }
h2 { font-size: 1.45rem; margin: 0 0 0.75rem; }
ul { padding-left: 1.2rem; margin: 0; }
li { margin: 0.35rem 0; }
p { margin: 0 0 0.9rem; }

.video { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; margin: 0.5rem 0 1rem; }
.video { display: block; }
.video img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video .play { position: absolute; left: 50%; top: 50%; width: 76px; height: 54px; margin: -27px 0 0 -38px; background: var(--wine); border-radius: 14px; opacity: 0.92; }
.video .play::after { content: ''; position: absolute; left: 31px; top: 15px; border-style: solid; border-width: 12px 0 12px 20px; border-color: transparent transparent transparent #fff; }
.video:hover .play, .video:focus-visible .play { opacity: 1; background: #7d1530; }
.jump { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.9rem; }
.jump .btn {
  appearance: none; font: 600 1rem/1.2 "Source Serif 4", Georgia, serif; color: var(--wine); background: #fff;
  border: 1.5px solid var(--wine); border-radius: 6px; padding: 0.55rem 0.9rem; cursor: pointer;
}
.jump .btn { text-decoration: none; }
.jump .btn:hover { background: #f3e8ec; }
.note { font-size: 0.98rem; color: var(--soft); }
.cta.alt { background: #fff; color: var(--wine); border: 1.5px solid var(--wine); }
.cta.alt:hover { background: #f3e8ec; }
.btns { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.9rem; }
.warn { border-left: 4px solid var(--gold); padding: 0.1rem 0 0.1rem 1rem; }

footer { padding: 2rem 0 3rem; border-top: 1px solid var(--line); font-size: 0.95rem; color: var(--soft); }

@media (max-width: 520px) {
  .doors button { font-size: 0.9rem; padding: 0.8rem 0.2rem; }
  .doors button span { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: no-preference) {
  main { transition: opacity 0.2s; }
  main.switching { opacity: 0; }
}
</style>

function esc(s) { return String(s).replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function mountGuestbook(lang, t) {
  var box = document.getElementById('gb'), g = LINKS.giscus;
  if (!box) return;
  if (!g.repoId || !g.categoryId) {
    box.innerHTML = '<a class="cta alt" href="' + LINKS.discuss + '">' + esc(t.gbBtn) + '</a>';
    return;
  }
  var sc = document.createElement('script');
  sc.src = 'https://giscus.app/client.js';
  var a = { 'data-repo': g.repo, 'data-repo-id': g.repoId, 'data-category': g.category, 'data-category-id': g.categoryId,
    'data-mapping': 'specific', 'data-term': g.term, 'data-strict': '1', 'data-reactions-enabled': '1', 'data-emit-metadata': '0',
    'data-input-position': 'top', 'data-theme': 'light', 'data-lang': lang, 'data-loading': 'lazy', 'crossorigin': 'anonymous' };
  for (var k in a) sc.setAttribute(k, a[k]);
  sc.async = true;
  box.appendChild(sc);
}

    // Rev.-Seite: kein eingebetteter Player mehr (startete mit Untertiteln und niedriger Aufloesung, beides laesst YouTube
    // im eingebetteten Player nicht festlegen). Grosses Vorschaubild + Knoepfe oeffnen das Video auf YouTube in voller Qualitaet.
    '<a class="video" href="' + ytUrl(0) + '" target="_blank" rel="noopener" aria-label="' + esc(t.fromStart) + '">' +
    '<img id="ytThumb" src="https://i.ytimg.com/vi/' + LINKS.videoId + '/maxresdefault.jpg" alt="" loading="lazy">' +
    '<span class="play" aria-hidden="true"></span></a>' +
    '<div class="jump"><a class="btn" href="' + ytUrl(0) + '" target="_blank" rel="noopener">' + esc(t.fromStart) + '</a>' +
    '<a class="btn" href="' + ytUrl(LINKS.jumpSec) + '" target="_blank" rel="noopener">' + esc(t.fromJump) + '</a></div>' +
    '<p class="note">' + esc(t.videoNote) + '</p><p class="note">' + esc(t.formLbl) + '<a href="' + LINKS.form + '">' + LINKS.form.replace('https://', '') + '</a></p></section>' +
    // Gaestebuch folgt spaeter (Google-Formular mit Freigabe); bis dahin ausgeblendet
    '' +
    '<section><h2>' + esc(t.sysH) + '</h2><p>' + esc(t.sysP) + '</p></section>' +
    '<section><h2>' + esc(t.devH) + '</h2><p class="warn">' + esc(t.devP) + '</p></section>' +
    '<section><h2>' + esc(t.updH) + '</h2><p>' + esc(t.updP) + '</p><p>' + esc(t.futP) + '</p></section>' +
    '<section id="note"><h2>' + esc(t.noteH) + '</h2><p>' + esc(t.noteP) + '</p>' +
    '<div class="btns"><a class="cta" href="' + LINKS.form + '" target="_blank" rel="noopener">' + esc(t.noteBtn) + '</a>' +
    '<a class="cta alt" href="' + LINKS.forum + '" target="_blank" rel="noopener">' + esc(t.forumBtn) + '</a></div>' +
    '<p class="note">' + esc(t.forumNote) + '</p></section>' +
    '<footer>' + esc(t.foot) + '</footer>';
  mountGuestbook(lang, t);
  var th = document.getElementById('ytThumb');   // Fallback, falls kein Vorschaubild in hoher Aufloesung existiert
  if (th) {
    th.onerror = function() { th.onerror = function() { th.style.display = 'none'; }; th.src = 'https://i.ytimg.com/vi/' + LINKS.videoId + '/hqdefault.jpg'; };
    th.onload = function() { if (th.naturalWidth && th.naturalWidth < 200) { th.onload = null; th.src = 'https://i.ytimg.com/vi/' + LINKS.videoId + '/hqdefault.jpg'; } };
  }
  Array.prototype.forEach.call(document.querySelectorAll('.doors button'), function(b) {
    b.setAttribute('aria-selected', b.getAttribute('data-lang') === lang ? 'true' : 'false');
  });
}
function pick() {
  var h = (location.hash || '').replace('#', '').toLowerCase();
  if (T[h]) return h;
  var n = ((navigator.language || 'en') + '').slice(0, 2).toLowerCase();
  return T[n] ? n : 'en';
}
Array.prototype.forEach.call(document.querySelectorAll('.doors button'), function(b) {
  b.onclick = function() {
    var l = b.getAttribute('data-lang');
    // In Vorschau-Fenstern (z. B. eingebettet als srcdoc) ist replaceState verboten -- dann nur umschalten, ohne Adresszeile
    try { history.replaceState(null, '', '#' + l); } catch (e) {}
    render(l);
  };
});
window.addEventListener('hashchange', function() { render(pick()); });
render(pick());
</script>
</body>
</html>
